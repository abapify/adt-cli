---
exclude_paths:
  # Non-UTF8 binary fixture — crashes the SARIF formatter
  # (MalformedInputException) when a tool result references it
  - 'packages/adt-plugin-abapgit/tests/fixtures/smim/ztest_mime.smim.ztest_mime.png'
  # Uninitialised gitlinks and directory symlinks — unreadable as files and
  # can crash the SARIF formatter when a tool result references them
  - 'git_modules/**'
  - '.devin/rules/**'
  - '.devin/skills/**'
  - '.windsurf/rules/**'
  # Dev-only AFF tooling — every fs path is a repo/submodule-derived
  # constant by design, so the non-literal-fs-filename audit rule only
  # produces false positives here. Inline nosemgrep comments are not
  # honoured by Codacy's bundled pipeline, hence path exclusion.
  - 'packages/adt-plugin-gcts/scripts/aff-coverage.ts'
  - 'packages/adt-plugin-gcts/scripts/generate-aff-schemas.ts'
engines:
  csslint:
    exclude_paths:
      # CSSLint does not support CSS custom properties used by Docusaurus/Infima
      - 'website/src/css/custom.css'
  eslint-8:
    exclude_paths: []
  remark-lint:
    # Excluded entirely: it is the only engine producing issues here, and the
    # SARIF formatter crashes (MalformedInputException) while serialising its
    # results — upstream bug codacy/codacy-analysis-cli#521. Markdown style
    # linting has no security value for this scan. `enabled: false` is not
    # honoured by codacy-analysis-cli 4.0.0, so the engine is starved of
    # files instead.
    exclude_paths:
      - '**'
      - '*'
