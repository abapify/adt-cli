# SonarQube Cloud Automatic Analysis configuration
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Scope the whole-repo scan to first-party code.
# git_modules/ is a vendored submodule (SAP/abap-file-formats) — its code is
# owned upstream and cannot be fixed in this repository.
# (Issue ignores such as S5332/S4721/S4036/S7637 must be configured in the
# SonarCloud UI; sonar.issue.ignore.* is not honored by Automatic Analysis.)
sonar.exclusions=\
  bun.lock,\
  CHANGELOG.md,\
  git_modules/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/tmp/**,\
  **/.git/**,\
  **/.nx/**,\
  **/generated/**,\
  .agents/**,\
  .cursor/**,\
  .windsurf/**,\
  .claude/**,\
  packages/adt-plugin-gcts/scripts/aff-coverage.ts,\
  packages/adt-cli/src/lib/commands/object/builder.ts,\
  packages/adt-cli/src/lib/commands/function/module.ts,\
  packages/adt-fixtures/src/mock-server/**

# aff-coverage.ts is dev-only tooling — execFileSync('git', ...) on
# repo-derived paths is by design, and Automatic Analysis ignores inline
# NOSONAR for S4036.

sonar.cpd.exclusions=\
  **/generated/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/tests/**,\
  **/fixtures/**,\
  packages/adt-fixtures/src/mock-server/**
