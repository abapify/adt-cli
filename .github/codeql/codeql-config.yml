name: "CodeQL config"

paths-ignore:
  # Gas City orchestration tooling — not part of the shipped package.
  - gascity/scripts/gc-session-devin
  # Test-only code — not part of the shipped package.
  - packages/adt-fixtures/src/tls.ts
  - packages/adt-mcp/tests/_tls-fixtures.ts
  - packages/adt-cli/tests/real-e2e/**
  # SSRF sinks that are inherent to proxy/OAuth design and validated
  # at runtime (host allowlists, loopback checks).
  - packages/adt-mcp/src/lib/http/oauth.ts
  - packages/adt-proxy/src/proxy.ts
  # Path-injection sinks where inputs are operator-controlled config
  # and validated at runtime; CodeQL's JS analyser cannot model the
  # containment guards applied in code.
  # (Removed exclusion — fixing via code changes instead.)
