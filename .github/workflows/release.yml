name: Release

on:
  # Semantic auto-release: every push to main lets `nx release` inspect
  # conventional commits since the last release tag. Versioning is fixed —
  # every package.json bumps to the same release version — but publish.yml
  # publishes only affected packages (+ internal deps) by default, so npm
  # versions only advance where code actually changed. Pushes with no
  # feat/fix commits produce no release and exit early. Release commits
  # carry `[skip ci]` and are pushed by GITHUB_TOKEN, so they never
  # retrigger this workflow.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump level (auto = conventional commits)'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease
        default: auto
      dry_run:
        description: 'Dry run (preview changes without publishing)'
        required: false
        default: false
        type: boolean
      first_release:
        description: 'First release (no previous git tag exists yet)'
        required: false
        default: false
        type: boolean
      affected_only:
        description: 'Publish only affected packages (+ internal deps). Uncheck to publish all'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Publish packages to npm after releasing'
        required: false
        default: false
        type: boolean
      publish_gpr:
        description: 'Publish packages to GitHub Packages after releasing'
        required: false
        default: false
        type: boolean
      publish_docker:
        description: 'Build and push Docker image after releasing'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, Changelog & Tag
    runs-on: ubuntu-latest
    # Release always runs against `main`, so use the read-write Nx Cloud
    # token directly from repository secrets.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_RW }}
      NX_NO_CLOUD: 'true'
    permissions:
      contents: write # needed to push commits and tags
      id-token: write # needed for provenance data generation
      actions: write # needed to dispatch publish.yml via `gh workflow run`
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.get_tags.outputs.first_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          # Deploy key (RELEASE_DEPLOY_KEY) authenticates git push so nx release
          # can push the release commit/tag to protected main via ruleset bypass.
          # GITHUB_TOKEN remains used for GitHub API calls (releases, dispatch).

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Print Environment Info
        run: ./node_modules/.bin/nx report
        shell: bash

      - name: Version, changelog & tag (dry run)
        if: ${{ inputs.dry_run }}
        run: ./node_modules/.bin/nx release ${{ inputs.specifier != 'auto' && inputs.specifier || '' }} --verbose --dry-run ${{ inputs.first_release && '--first-release' || '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version, changelog & tag
        if: ${{ !inputs.dry_run }}
        run: ./node_modules/.bin/nx release ${{ inputs.specifier != 'auto' && inputs.specifier || '' }} --verbose --skip-publish ${{ inputs.first_release && '--first-release' || '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release tags
        # `nx release` creates the v{version} tag at HEAD when it versioned
        # something. No tag means conventional commits found nothing
        # semver-worthy — downstream steps are guarded on this output.
        id: get_tags
        if: ${{ !inputs.dry_run }}
        run: |
          TAGS=$(git tag --points-at HEAD | sort | paste -sd, -)
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "first_tag=$(echo "$TAGS" | cut -d, -f1)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "release tags at HEAD: ${TAGS:-<none>}"

      # NOTE: `nx release` commits, tags AND pushes itself
      # (`git push --follow-tags --atomic`) because workspaceChangelog's
      # `createRelease: "github"` needs the commit on the remote before it
      # can create the GitHub release. It also refreshes bun.lock in the
      # release commit itself, so no post-step amend/push is needed — any
      # amend here would create an orphan sibling that can't fast-forward
      # over the already-pushed commit (this raced and failed for 0.4.19).

      - name: Enrich release notes with PR authors
        if: ${{ !inputs.dry_run && steps.get_tags.outputs.tags != '' }}
        # Nx's changelog resolves git emails to GitHub usernames via ungh.cc
        # and GitHub search. If a contributor's email is private, both fail
        # and the author gets no @mention — GitHub's release Contributors
        # section then skips them. This step cross-references PR authors via
        # the GitHub API (which always knows the login) and appends any
        # missing @mentions to the release notes.
        # Non-blocking: enrichment is best-effort and must not prevent the
        # publish workflow from dispatching on failure.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.get_tags.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            ./node_modules/.bin/tsx tools/enrich-release-notes.ts "$tag" || true
          done

      - name: Dispatch publish workflow
        # Auto-publish on push-triggered releases; on manual dispatch the
        # `publish` checkbox decides. `affected_only` is forwarded so
        # publish.yml knows whether to publish the affected subset or all.
        if: ${{ !inputs.dry_run && steps.get_tags.outputs.tags != '' && (github.event_name == 'push' || inputs.publish) }}
        # Can't rely on `push: tags:` auto-trigger in publish.yml — events
        # caused by GITHUB_TOKEN pushes don't cascade to other workflows
        # (GitHub Actions by design). Invoke publish.yml via workflow_dispatch
        # so it runs with its own workflow_ref and our OIDC trusted
        # publisher entries match. We pass the release TAG as the
        # `version` input so publish.yml checks out exactly this commit —
        # a racing merge on main can't shift which tree gets published.
        # (actions/checkout can't resolve a raw SHA in `ref`; the tag
        # points at the release commit and is just as precise.)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.affected_only }}" = "false" ]; then
            gh workflow run publish.yml --ref main -f affected_only=false -f "version=${{ steps.get_tags.outputs.first_tag }}"
          else
            gh workflow run publish.yml --ref main -f "version=${{ steps.get_tags.outputs.first_tag }}"
          fi

  # Note: npm publishing is NOT wired up as `workflow_call` here. When
  # `publish.yml` is invoked via `uses:`, the resulting OIDC token's
  # claims reflect the CALLER (release.yml), and npm's trusted publisher
  # matcher rejects that because the trust entries on npmjs are
  # registered with `--file publish.yml`. Instead we dispatch publish.yml
  # on `main` — that path keeps workflow_ref=publish.yml, so OIDC
  # matches. The `push: tags:` trigger in publish.yml only fires when a
  # human pushes a tag manually.

  publish-gpr:
    name: Publish packages to GitHub Packages
    needs: release
    if: ${{ !inputs.dry_run && inputs.publish_gpr }}
    uses: ./.github/workflows/publish-gpr.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write

  docker:
    name: Build and push Docker image
    needs: release
    if: ${{ !inputs.dry_run && inputs.publish_docker }}
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write
