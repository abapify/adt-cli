name: Publish

on:
  # Auto-trigger on version tags. NOTE: tags pushed by release.yml's
  # GITHUB_TOKEN do NOT cascade-trigger this workflow (GitHub Actions by
  # design) — release.yml dispatches us explicitly on `main`. This trigger
  # only fires for tags pushed by a human. We intentionally do NOT use
  # `workflow_call` from release.yml: when publish.yml runs as a reusable
  # workflow, the OIDC token's claims reflect the CALLER (release.yml) and
  # npm's trusted publisher matcher rejects them, even though
  # `job_workflow_ref` is publish.yml. Running on tag push / our own
  # dispatch gives us workflow_ref=publish.yml directly, which is what
  # every trusted publisher entry on npmjs is registered for (via
  # `npm trust github … --file publish.yml`).
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: 'Ref to publish from (tag, branch or sha), defaults to the ref that triggered the workflow'
        required: false
        type: string
      affected_only:
        description: 'Publish only affected packages (+ internal deps)'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Ref to publish from (tag, branch or sha), defaults to the dispatch ref'
        required: false
        type: string
      affected_only:
        description: 'Publish only affected packages (+ internal deps). Uncheck to publish all'
        required: false
        default: true
        type: boolean

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    # Publish always runs against a version tag on `main` — use the
    # read-write Nx Cloud token from repository secrets.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_RW }}
    permissions:
      contents: read
      id-token: write # needed for provenance data generation
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0 # needed for `nx show projects --affected` and prev-tag lookup

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Override @abapify scope registry for npmjs publishing
        # The repo-level .npmrc is shaped for CI CONSUMERS of the package
        # (GHP auth token for the @abapify scope). For the publish job we
        # don't need any of that — we're publishing, not installing. Any
        # leftover scope pin or `_authToken` line (even for a different
        # registry like npm.pkg.github.com) may short-circuit npm's OIDC
        # auto-discovery, so nuke the repo-level .npmrc entirely.
        run: |
          : > .npmrc
          echo "--- effective repo .npmrc ---"
          cat .npmrc
          echo "(end)"

      - name: Clean setup-node .npmrc for OIDC
        # actions/setup-node with `registry-url` writes
        #   always-auth=true
        #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
        # Since we don't pass a `token` to setup-node, NODE_AUTH_TOKEN is
        # effectively empty, so npm ends up sending an empty Authorization
        # header on PUT and npmjs responds `Not Found`. To make OIDC
        # trusted publishing kick in, the registry entry must be present
        # without any token line — npm then asks GitHub Actions for an
        # id-token and exchanges it for a publish token.
        run: |
          cat > "$NPM_CONFIG_USERCONFIG" <<'EOF'
          registry=https://registry.npmjs.org/
          EOF
          echo "--- effective userconfig ($NPM_CONFIG_USERCONFIG) ---"
          cat "$NPM_CONFIG_USERCONFIG"

      - name: Force npm as nx release publish driver (for this job only)
        # nx.json keeps `cli.packageManager: bun` globally — bun is the
        # monorepo's workspace package manager, handles `workspace:*`
        # dependency protocol etc. But Nx 22's @nx/js:release-publish
        # honours that setting and invokes `bun publish`, which does NOT
        # support OIDC trusted publishing and errors with `missing
        # authentication`. Switching nx.json permanently breaks
        # `nx release version` (npm can't resolve `workspace:*`), so we
        # flip it to npm in this job only and leave the committed file
        # alone.
        run: |
          node -e "
            const fs = require('node:fs');
            const p = 'nx.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.cli = { ...(j.cli ?? {}), packageManager: 'npm' };
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          grep -A1 '\"cli\"' nx.json

      - name: Diagnose OIDC readiness
        # Sanity-check: confirm the GitHub Actions OIDC env vars that npm
        # 11.5+ sniffs (ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN) are actually
        # present in this step's env. Without them, `npm publish` falls
        # through to "not logged in".
        run: |
          echo "npm version: $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set? $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo NO)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set? $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo NO)"
          echo "--- userconfig ($NPM_CONFIG_USERCONFIG) ---"
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no userconfig file)"
          echo "--- repo .npmrc ---"
          cat .npmrc
          echo "--- OIDC token preview ---"
          token=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$token" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{iss, sub, workflow, workflow_ref, job_workflow_ref, repository, ref}'

      - name: Build all packages
        # `nx release publish` already builds via the nx-release-publish
        # target's `dependsOn: ["build"]`, but we build explicitly so the
        # pack-check gate below has real artifacts to inspect — and so a
        # future config drift can never again ship package.json + README
        # only tarballs (see @abapify/*@0.3.5/0.3.6, which went out empty).
        run: ./node_modules/.bin/nx run-many -t build
        shell: bash

      - name: Preflight npm trusted publishing checks
        # --require-existing: OIDC trusted publishing cannot create a
        #   package — anything absent from npm must be bootstrapped first
        #   (`nx run <pkg>:prepare-for-publish`, needs npm login + 2FA).
        # --pack-check: `npm pack --dry-run` must contain dist/ files.
        run: ./node_modules/.bin/nx run-many -t npm-trust-check --require-existing --pack-check
        shell: bash

      - name: Publish packages
        # affected_only (default): only projects changed since the previous
        # release tag get published. `nx release publish --projects`
        # refuses subsets inside a fixed release group, so instead every
        # untouched project's package.json is restored to the previous tag
        # — its disk version then equals the already-published one and nx
        # skips it. Dep pins inside affected manifests are restored for
        # untouched deps the same way, so no published package ever
        # requires an unpublished internal version.
        # head=HEAD^: the checked-out ref IS the release commit, which
        # touches every package.json — counting it would mark all
        # projects affected and defeat the filter.
        # --nxBail=false: a single package failing must not cascade-skip
        # its dependents — publish everything that can publish so the
        # registry state stays as complete as possible.
        id: pub
        run: |
          if [ "${{ inputs.affected_only }}" = "false" ]; then
            echo "affected=adt-cli,adt-mcp,adt" >> "$GITHUB_OUTPUT"
            ./node_modules/.bin/nx release publish --nxBail=false
            exit 0
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 --match='v*' 'HEAD^' 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found — publishing everything"
            echo "affected=adt-cli,adt-mcp,adt" >> "$GITHUB_OUTPUT"
            ./node_modules/.bin/nx release publish --nxBail=false
            exit 0
          fi
          AFFECTED=$(./node_modules/.bin/nx show projects --affected --base="$PREV_TAG" --head='HEAD^' | paste -sd, -)
          echo "Affected since $PREV_TAG: ${AFFECTED:-<none>}"
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
          if [ -z "$AFFECTED" ]; then
            echo "Nothing affected — nothing to publish"
            exit 0
          fi
          AFFECTED="$AFFECTED" PREV_TAG="$PREV_TAG" node <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execSync } = require('node:child_process');
          const PREV = process.env.PREV_TAG;
          const affected = new Set(process.env.AFFECTED.split(',').filter(Boolean));
          const roots = fs.readdirSync('packages', { withFileTypes: true })
            .filter(d => d.isDirectory()).map(d => `packages/${d.name}`);
          const proj = new Map();
          for (const root of roots) {
            if (!fs.existsSync(`${root}/package.json`)) continue;
            let name = path.basename(root);
            try { name = JSON.parse(fs.readFileSync(`${root}/project.json`, 'utf8')).name || name; } catch {}
            proj.set(name, { root, pkg: JSON.parse(fs.readFileSync(`${root}/package.json`, 'utf8')) });
          }
          const projOfPkg = new Map([...proj].map(([n, v]) => [v.pkg.name, n]));
          const prevCache = new Map();
          const prevJson = (root) => {
            if (!prevCache.has(root)) {
              let v = null;
              try { v = JSON.parse(execSync(`git show ${PREV}:${root}/package.json`, { encoding: 'utf8' })); } catch {}
              prevCache.set(root, v);
            }
            return prevCache.get(root);
          };
          const SECS = ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies'];
          const onNpm = (name, ver) => {
            try {
              execSync(`npm view ${name}@${ver} version`, { encoding: 'utf8', stdio: 'pipe' });
              return true;
            } catch { return false; }
          };
          // The npm version each project ends up at: affected → the bumped
          // disk version; unaffected → its previous version if that one is
          // really on the registry (nx skips it), else the bumped disk
          // version (publishes fresh to backfill the missing release).
          const finalVer = new Map();
          for (const [name, { pkg, root }] of proj) {
            const prev = prevJson(root);
            const skipped = !affected.has(name) && prev && onNpm(pkg.name, prev.version);
            finalVer.set(name, skipped ? prev.version : pkg.version);
          }
          for (const [name, { root, pkg }] of proj) {
            const prev = prevJson(root);
            if (!affected.has(name)) {
              // Only restore the previous manifest if that version is ACTUALLY
              // on the registry — otherwise nx would happily publish a stale
              // tarball whose dep pins point at versions that never shipped
              // (see v0.4.18: adk@0.4.17 pinned adt-client@0.4.16, which was
              // never published, breaking the whole install tree).
              if (prev && finalVer.get(name) === prev.version) {
                fs.writeFileSync(`${root}/package.json`, JSON.stringify(prev, null, 2) + '\n');
                console.log(`restored ${name} -> ${prev.version} (on npm, will be skipped)`);
                continue;
              }
              console.log(`keep ${name} -> ${pkg.version} (prev ${prev?.version ?? '?'} missing on npm — publishing)`);
            }
            let changed = false;
            for (const s of SECS) {
              for (const dep of Object.keys(pkg[s] || {})) {
                const dp = projOfPkg.get(dep);
                if (!dp) continue;
                const wanted = finalVer.get(dp);
                if (wanted && wanted !== pkg[s][dep]) {
                  console.log(`${name}: pin ${dep} ${pkg[s][dep]} -> ${wanted}`);
                  pkg[s][dep] = wanted;
                  changed = true;
                }
              }
            }
            if (changed) fs.writeFileSync(`${root}/package.json`, JSON.stringify(pkg, null, 2) + '\n');
          }
          EOF
          ./node_modules/.bin/nx release publish --nxBail=false
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_LOGLEVEL: verbose
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-publish smoke test
        # The monorepo hoists a single zod (v4) for local dev, so version-
        # range bugs in published deps only surface on a clean install —
        # see adt-schemas using `.loose()` while gcts-cli pinned zod 3,
        # which crashed `adt` on startup in 0.4.4/0.4.5. Install the
        # just-published packages in isolation and execute them.
        run: |
          set -e
          # Packages released in this run must reach their disk version on
          # npm — retry until they do (registry read replicas lag for
          # minutes; the v0.4.7 smoke resolved a stale adt-mcp@0.4.6).
          # Packages NOT in the release keep their latest published
          # version — resolving latest for them is correct, not stale.
          AFFECTED=",${{ steps.pub.outputs.affected }},"
          in_set() { case "$AFFECTED" in *",$1,"*) return 0;; *) return 1;; esac; }
          disk_ver() { node -p "require('${{ github.workspace }}/packages/$1/package.json').version"; }
          want_ver() {
            # $1=nx project name $2=npm package name
            if in_set "$1"; then
              disk_ver "$1"
            else
              npm view "$2" version --loglevel=error
            fi
          }
          mkdir -p /tmp/adt-smoke && cd /tmp/adt-smoke
          npm init -y >/dev/null
          for i in $(seq 1 15); do
            CLI_V=$(want_ver adt-cli @abapify/adt-cli)
            MCP_V=$(want_ver adt-mcp @abapify/adt-mcp)
            ADT_V=$(want_ver adt @abapify/adt)
            echo "attempt $i — smoke versions: adt-cli=$CLI_V adt-mcp=$MCP_V adt=$ADT_V"
            if npm install "@abapify/adt-cli@${CLI_V}" "@abapify/adt-mcp@${MCP_V}" "@abapify/adt@${ADT_V}" \
                 --no-fund --no-audit --loglevel=error; then
              break
            fi
            if [ "$i" = "15" ]; then
              echo "install still failing after 15 attempts" >&2
              exit 1
            fi
            echo "install attempt $i failed (registry propagation?), retrying in 30s"
            sleep 30
          done
          ./node_modules/.bin/adt --help >/dev/null
          ./node_modules/.bin/adt --version
          node --input-type=module -e \
            "import('@abapify/adt-mcp').then(() => console.log('adt-mcp import OK'))"
          # Standalone bundle — verify the embedded build actually runs
          node node_modules/@abapify/adt/dist/adt.mjs --version
        shell: bash
