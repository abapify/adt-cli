name: CI

on:
  push:
    branches:
      # Runs on merge to main only
      - main
  pull_request:

# Cancel in-progress PR runs; let main builds finish so the Nx Cloud cache is populated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Pushes to `main` get the read-write Nx Cloud token so the remote
    # cache is populated; everything else (PRs, other branches) gets the
    # read-only token, which is safe to expose. Both tokens live as
    # repository secrets — we intentionally avoid GitHub Environments
    # here because they register every run as a "deployment" in the UI.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.NX_CLOUD_ACCESS_TOKEN_RW || secrets.NX_CLOUD_ACCESS_TOKEN_RO }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # AFF conformance tests read schemas/examples from the
          # git_modules/abap-file-formats submodule — it must be initialized.
          submodules: true
          # For pull_request events, check out the PR head (not GitHub's auto-created
          # merge commit). This prevents 3-way merge from re-introducing deps that
          # the PR is supposed to remove. nrwl/nx-set-shas still computes the correct
          # affected range from git history. Falls back to github.sha for push events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check for code changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "$HEAD" | grep -qvE '^website/|^docs/|\.md$|^netlify\.toml$'; then
            echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-code-changes=false" >> "$GITHUB_OUTPUT"
            echo "Skipping heavy CI steps: only docs/website/markdown files changed."
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.has-code-changes == 'true'
        with:
          node-version: lts/*
      # Ungated: the deps-check step below runs on docs-only changes too.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Cache bun dependencies
        if: steps.changes.outputs.has-code-changes == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      # This line enables distribution
      # The "--stop-agents-after" is optional, but allows idle agents to shut down once the "e2e-ci" targets have been requested
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"
      - run: bun install --frozen-lockfile --ignore-scripts
        if: steps.changes.outputs.has-code-changes == 'true'

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        if: steps.changes.outputs.has-code-changes == 'true'

      - name: Test tool-call hook scripts
        if: steps.changes.outputs.has-code-changes == 'true'
        run: bash .github/hooks/scripts/test-hooks.sh
        shell: bash
      - name: Print Environment Info
        if: steps.changes.outputs.has-code-changes == 'true'
        run: ./node_modules/.bin/nx report
        shell: bash
      - name: Check formatting for changed files
        if: steps.changes.outputs.has-code-changes == 'true'
        run: ./node_modules/.bin/nx format:check --base=$NX_BASE --head=$NX_HEAD
      - name: Run affected lint, test, build and e2e-ci
        if: ${{ env.NX_CLOUD_ACCESS_TOKEN != '' && steps.changes.outputs.has-code-changes == 'true' }}
        run: ./node_modules/.bin/nx affected -t lint test build e2e-ci typecheck:test --verbose=false --parallel=3
      - run: ./node_modules/.bin/nx affected -t lint test build e2e-ci typecheck:test --verbose=false --parallel=3 --no-cloud
        if: ${{ env.NX_CLOUD_ACCESS_TOKEN == '' && steps.changes.outputs.has-code-changes == 'true' }}
      - name: Run affected source typecheck (excludes tracked missing coverage)
        if: ${{ env.NX_CLOUD_ACCESS_TOKEN != '' && steps.changes.outputs.has-code-changes == 'true' }}
        # adt-mcp, adt-server, adt-server-client: MISSING COVERAGE (OOM), tracked in
        # https://github.com/abapify/adt-cli/issues/311 — do not treat as passing.
        run: ./node_modules/.bin/nx affected -t typecheck --exclude=adt-mcp,adt-server,adt-server-client --verbose=false --parallel=3
      - name: Run affected source typecheck (no-cloud, excludes tracked missing coverage)
        if: ${{ env.NX_CLOUD_ACCESS_TOKEN == '' && steps.changes.outputs.has-code-changes == 'true' }}
        run: ./node_modules/.bin/nx affected -t typecheck --exclude=adt-mcp,adt-server,adt-server-client --verbose=false --parallel=3 --no-cloud
      - name: Check generated CLI/MCP reference docs are up to date
        # Ungated: a docs-only change that hand-edits a generated page must
        # fail too. Fix locally with `bunx nx run docs-gen:docs:gen`.
        run: |
          [ -d node_modules ] || bun install --frozen-lockfile --ignore-scripts
          ./node_modules/.bin/nx run docs-gen:docs:check --verbose=false
      - name: Run deps-check workspace-wide
        # Always full sweep, ungated — the change detector excludes
        # website/ paths, and checker-only changes need every project
        # re-validated anyway. Self-installs when the gated setup steps
        # were skipped (docs-only changes).
        run: |
          [ -d node_modules ] || bun install --frozen-lockfile --ignore-scripts
          ./node_modules/.bin/nx run-many -t deps-check --verbose=false --parallel=6
      - run: ./node_modules/.bin/nx-cloud fix-ci
        if: always() && env.NX_CLOUD_ACCESS_TOKEN != '' && steps.changes.outputs.has-code-changes == 'true'
